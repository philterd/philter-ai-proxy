services:

  philter:
    image: philterd/philter-api-ref
    ports:
      - "8081:8080"

  philter-ai-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - philter
    environment:
      - PHILTER_ENDPOINT=http://philter:8080
      - PHILTER_PROXY_PORT=8080
      - PHILTER_PROXY_CERT_FILE=cert.pem
      - PHILTER_PROXY_KEY_FILE=key.pem
