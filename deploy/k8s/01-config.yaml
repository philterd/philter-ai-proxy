apiVersion: v1
kind: Secret
metadata:
  name: philter-ai-proxy-config
  labels:
    app: philter-ai-proxy
type: Opaque
stringData:
  config.yaml: |
    listen:
      port: 8080
      cert: /etc/philter-proxy/tls/tls.crt
      key: /etc/philter-proxy/tls/tls.key
      shutdownTimeout: 30

    logging:
      enabled: true

    metrics:
      enabled: true
      port: 9090

    philter:
      # Update this to point at your Philter service.
      endpoint: http://philter.philter-system.svc.cluster.local:8080
      tlsVerify: false
      retry:
        maxAttempts: 3
        initialBackoffMs: 100
        maxBackoffMs: 2000

    providers:
      openai:
        target: https://api.openai.com
      anthropic:
        target: https://api.anthropic.com
      gemini:
        target: https://generativelanguage.googleapis.com
      ollama:
        target: http://localhost:11434

    defaults:
      policy: default
      context: none
