{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "philter-ai-proxy.secretName" . }}
  labels:
    {{- include "philter-ai-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  encryption-key: {{ required "secrets.encryptionKey is required unless secrets.existingSecret is set (openssl rand -hex 32)" .Values.secrets.encryptionKey | quote }}
  {{- with .Values.secrets.bootstrapApiKey }}
  bootstrap-api-key: {{ . | quote }}
  {{- end }}
{{- end -}}
