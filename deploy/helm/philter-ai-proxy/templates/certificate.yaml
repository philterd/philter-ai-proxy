{{- if eq .Values.tls.mode "certManager" -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "philter-ai-proxy.fullname" . }}
  labels:
    {{- include "philter-ai-proxy.labels" . | nindent 4 }}
spec:
  secretName: {{ include "philter-ai-proxy.tlsSecretName" . }}
  dnsNames:
    {{- range .Values.tls.certManager.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
    name: {{ required "tls.certManager.issuerRef.name is required when tls.mode=certManager" .Values.tls.certManager.issuerRef.name }}
{{- end -}}
