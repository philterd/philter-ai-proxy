apiVersion: v1
kind: Service
metadata:
  name: {{ include "philter-ai-proxy.fullname" . }}
  labels:
    {{- include "philter-ai-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: proxy
      port: {{ .Values.service.port }}
      targetPort: proxy
      protocol: TCP
  selector:
    {{- include "philter-ai-proxy.selectorLabels" . | nindent 4 }}
{{- if .Values.service.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "philter-ai-proxy.fullname" . }}-metrics
  labels:
    {{- include "philter-ai-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- with .Values.service.metrics.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.metrics.type }}
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "philter-ai-proxy.selectorLabels" . | nindent 4 }}
{{- end }}
