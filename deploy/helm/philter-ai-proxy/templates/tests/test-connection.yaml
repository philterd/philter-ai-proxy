apiVersion: v1
kind: Pod
metadata:
  name: {{ include "philter-ai-proxy.fullname" . }}-test-connection
  labels:
    {{- include "philter-ai-proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      args:
        - -fsS
        - -k
        - --max-time
        - "5"
        - {{ include "philter-ai-proxy.scheme" . | lower }}://{{ include "philter-ai-proxy.fullname" . }}:{{ .Values.service.port }}/livez
