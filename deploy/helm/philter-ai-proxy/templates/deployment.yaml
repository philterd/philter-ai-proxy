{{- $fullName := include "philter-ai-proxy.fullname" . -}}
{{- $tlsFromSecret := or (eq .Values.tls.mode "existingSecret") (eq .Values.tls.mode "certManager") -}}
{{- if not (has .Values.tls.mode (list "selfSigned" "existingSecret" "certManager" "none")) -}}
{{- fail (printf "tls.mode must be one of selfSigned, existingSecret, certManager, none (got %q)" .Values.tls.mode) -}}
{{- end -}}
{{- if and .Values.mtls.enabled (not $tlsFromSecret) -}}
{{- fail "mtls.enabled needs tls.mode existingSecret or certManager" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "philter-ai-proxy.labels" . | nindent 4 }}
spec:
  # One instance per SQLite file: Recreate stops the old pod before the new one opens the database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "philter-ai-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "philter-ai-proxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "philter-ai-proxy.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: philter-ai-proxy
          image: {{ include "philter-ai-proxy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/philter-ai-proxy/application.yaml
            - name: PHILTER_AI_PROXY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "philter-ai-proxy.secretName" . }}
                  key: encryption-key
            - name: PHILTER_AI_PROXY_BOOTSTRAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "philter-ai-proxy.secretName" . }}
                  key: bootstrap-api-key
                  optional: true
            - name: PROXY_TLS_DEVSELFSIGNEDCERT
              value: {{ eq .Values.tls.mode "selfSigned" | quote }}
            {{- if $tlsFromSecret }}
            - name: SERVER_SSL_CERTIFICATE
              value: /etc/philter-ai-proxy/tls/tls.crt
            - name: SERVER_SSL_CERTIFICATEPRIVATEKEY
              value: /etc/philter-ai-proxy/tls/tls.key
            - name: SERVER_SSL_ENABLEDPROTOCOLS
              value: TLSv1.3,TLSv1.2
            {{- end }}
            {{- if .Values.mtls.enabled }}
            - name: SERVER_SSL_TRUSTCERTIFICATE
              value: /etc/philter-ai-proxy/client-ca/ca.crt
            - name: SERVER_SSL_CLIENTAUTH
              value: need
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- $probe := deepCopy . }}
            {{- if $.Values.mtls.enabled }}
            {{- /* The kubelet presents no client certificate, so under mTLS an HTTPS probe cannot connect. */}}
            {{- $_ := set $probe "tcpSocket" (dict "port" $probe.httpGet.port) }}
            {{- $_ := unset $probe "httpGet" }}
            {{- else }}
            {{- $_ := set $probe.httpGet "scheme" (include "philter-ai-proxy.scheme" $) }}
            {{- end }}
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- $probe := deepCopy . }}
            {{- if $.Values.mtls.enabled }}
            {{- /* The kubelet presents no client certificate, so under mTLS an HTTPS probe cannot connect. */}}
            {{- $_ := set $probe "tcpSocket" (dict "port" $probe.httpGet.port) }}
            {{- $_ := unset $probe "httpGet" }}
            {{- else }}
            {{- $_ := set $probe.httpGet "scheme" (include "philter-ai-proxy.scheme" $) }}
            {{- end }}
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- $probe := deepCopy . }}
            {{- if $.Values.mtls.enabled }}
            {{- /* The kubelet presents no client certificate, so under mTLS an HTTPS probe cannot connect. */}}
            {{- $_ := set $probe "tcpSocket" (dict "port" $probe.httpGet.port) }}
            {{- $_ := unset $probe "httpGet" }}
            {{- else }}
            {{- $_ := set $probe.httpGet "scheme" (include "philter-ai-proxy.scheme" $) }}
            {{- end }}
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/philter-ai-proxy/application.yaml
              subPath: application.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/philter-ai-proxy
            # Native libraries (ONNX Runtime, SQLite) are unpacked here, and the development certificate written.
            - name: tmp
              mountPath: /tmp
            {{- if $tlsFromSecret }}
            - name: tls
              mountPath: /etc/philter-ai-proxy/tls
              readOnly: true
            {{- end }}
            {{- if .Values.mtls.enabled }}
            - name: client-ca
              mountPath: /etc/philter-ai-proxy/client-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullName }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" $fullName) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if $tlsFromSecret }}
        - name: tls
          secret:
            secretName: {{ include "philter-ai-proxy.tlsSecretName" . }}
        {{- end }}
        {{- if .Values.mtls.enabled }}
        - name: client-ca
          secret:
            secretName: {{ required "mtls.caSecretName is required when mtls.enabled" .Values.mtls.caSecretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
