name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly. A vulnerability disclosed after the last commit still needs to
    # surface on a repository that can go quiet between releases.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:

  # GATES the build, and mirrors the scan in push-image.sh so a failure
  # shows up on the pull request rather than at publish time. It covers both the
  # base image's packages and the Java libraries inside the proxy's jar.
  #
  # ignore-unfixed means only findings with an upstream fix can fail, since an
  # unfixable CVE is not something a rebuild can resolve. Suppress a specific
  # finding in .trivyignore.
  #
  # The image is built and scanned, never pushed: images are published by hand
  # with push-image.sh.
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build image
      run: docker build -t philter-ai-proxy:scan .

    - name: Scan image
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        # Pull the database from the mirror first. Anonymous ghcr.io pulls from
        # shared CI address ranges get rate limited.
        TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      with:
        image-ref: philter-ai-proxy:scan
        scanners: vuln
        ignore-unfixed: true
        severity: HIGH,CRITICAL
        exit-code: '1'
        format: table
