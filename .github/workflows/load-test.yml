name: Load test

# Runs the k6 scenarios against the local docker-compose stack.
#   - workflow_dispatch: triggered manually from the GitHub UI.
#   - schedule: nightly baseline so the team gets a regression signal.
#
# The job uploads per-scenario summary JSONs as artifacts. It does NOT yet
# fail PRs on regression - the AC for #116 is "publishes a small baseline
# run", not a hard gate. Tightening to a gate is a follow-up once the
# baseline numbers have stabilized in production.

on:
  workflow_dispatch:
    inputs:
      vus:
        description: 'Virtual users per scenario'
        required: false
        default: '10'
      duration:
        description: 'Duration per scenario (e.g. 30s, 2m)'
        required: false
        default: '30s'
  schedule:
    # Sunday 06:00 UTC
    - cron: '0 6 * * 0'

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up load-test stack
        run: |
          docker compose -f test/load/docker-compose.load.yaml up -d --build
          # Wait for the proxy's /livez to start returning 200. The
          # compose file's healthchecks cover the stub; the proxy doesn't
          # have one yet, so poll from outside.
          for i in $(seq 1 60); do
            if curl -sk -m 2 https://localhost:8080/livez >/dev/null; then
              echo "proxy is up"
              break
            fi
            sleep 1
          done

      - name: Run scenarios
        env:
          VUS: ${{ inputs.vus || '10' }}
          DURATION: ${{ inputs.duration || '30s' }}
        run: |
          mkdir -p test/load/results
          chmod 777 test/load/results
          # `set +e` so one failing threshold doesn't skip the rest of
          # the scenarios; we want every scenario's summary available
          # for triage.
          set +e
          for s in no-redaction openai anthropic openai-streaming outbound-scan; do
            echo "=== $s ==="
            ./test/load/run.sh "$s" || true
          done
          set -e

      - name: Tear down
        if: always()
        run: docker compose -f test/load/docker-compose.load.yaml down -v

      - name: Upload summary JSONs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summaries
          path: test/load/results/*.summary.json
          if-no-files-found: warn
