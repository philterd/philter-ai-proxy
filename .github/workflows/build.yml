name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  # Compiles, runs every test, and fails when line coverage drops below the floor in pom.xml
  # (coverage.minimum). Raise the floor as coverage improves; do not lower it to make a build pass.
  #
  # The test that runs the default policy with the real PhEye model (ModelsTest) is skipped here: it needs
  # the model on disk, set with PHILTER_AI_PROXY_TEST_MODELS. The image build in security.yml downloads the
  # same model and checks its SHA-256.
  maven:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Build, test, and check coverage
      run: ./mvnw -B verify

    - name: Upload test and coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: |
          target/surefire-reports/
          target/site/jacoco/
        if-no-files-found: warn
