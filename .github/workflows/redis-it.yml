name: Redis integration

# Runs the rate-limit backend tests against a real Redis server (a service
# container), exercising the atomic token-bucket Lua script under genuine Redis
# semantics rather than the miniredis approximation used by the default unit
# tests. Gated behind the `realredis` build tag, so it never affects
# `go test ./...`.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  redis-it:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install dependencies
      run: go mod download

    - name: Run real-Redis integration tests
      env:
        REDIS_ADDR: localhost:6379
      run: go test -tags realredis -run '^TestRealRedis' -v ./...
