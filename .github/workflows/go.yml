name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Install dependencies
      run: go mod download

    # -race on a network-facing proxy: data races here are production bugs.
    - name: Test and coverage gate
      run: make cover-check TESTFLAGS="-v -race"

    - name: Upload coverage profile
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-profile
        path: coverage.out
        if-no-files-found: warn

    - name: Build
      run: make build
