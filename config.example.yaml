# version: 1   # optional config schema version; omit to track the current schema. See docs/configuration.md#configuration-compatibility

listen:
  port: 8080
  cert: cert.pem
  key: key.pem
  shutdownTimeout: 30
  # clientCA: /etc/ssl/client-ca.pem  # optional: enable mTLS by specifying the CA that signed client certs
  # maxConcurrentRequests: 0          # max in-flight requests; 0 = unlimited (default). Excess requests get HTTP 503 + Retry-After.
  # Inbound request hardening (secure defaults applied when unset). See docs/configuration.md#request-hardening
  # maxRequestBodyBytes: 10485760     # max inbound body (10 MiB default); larger → HTTP 413
  # maxHeaderBytes: 1048576           # max request header bytes (1 MiB default)
  # readHeaderTimeoutMs: 10000        # time to send headers (10s default); slowloris mitigation
  # readTimeoutMs: 0                  # whole-request read bound; 0 = disabled (default), set to bound slow-body uploads
  # tlsHandshakeTimeoutMs: 10000      # time to complete the TLS handshake (10s default); slow-handshake slowloris mitigation
  # maxConcurrentTLSHandshakes: 16384 # ceiling on simultaneous in-flight TLS handshakes; flood backstop (default 16384)

logging:
  enabled: true
  # file: /var/log/philter-ai-proxy/audit.log

metrics:
  enabled: true
  port: 9090

# OpenTelemetry tracing. Disabled by default. When enabled, configure the OTLP
# exporter via the standard OTel env vars (OTEL_EXPORTER_OTLP_ENDPOINT, etc.).
# See docs/monitoring.md#distributed-tracing for the full env-var reference.
# tracing:
#   enabled: true
#   serviceName: philter-ai-proxy

philter:
  endpoint: https://philter.internal:8080
  tlsVerify: true
  # caCert: /etc/ssl/internal-ca.pem
  retry:
    maxAttempts: 3        # total attempts (1 = no retry); default 3
    initialBackoffMs: 100 # initial backoff in ms; default 100
    maxBackoffMs: 2000    # maximum backoff in ms; default 2000
  circuitBreaker:
    enabled: false        # default false
    threshold: 5          # consecutive failures before opening; default 5
    timeoutSeconds: 30    # seconds in open state before probe; default 30
    fallback: block       # block (503, default) or passthrough (forward unredacted)
  # timeouts:             # per-Philter HTTP timeouts; same shape as providers.* below
  #   responseHeaderMs: 5000   # default 30000; tighten for an in-cluster Philter

providers:
  openai:
    target: https://api.openai.com
    # tlsVerify: true
    # timeouts:                 # per-provider HTTP timeouts (milliseconds; 0 or omitted = default)
    #   connectMs: 5000          # default 5000  - TCP dial
    #   tlsHandshakeMs: 5000     # default 5000  - TLS handshake
    #   responseHeaderMs: 30000  # default 30000 - wait for upstream to start responding (does NOT bound body reads)
    #   idleConnMs: 90000        # default 90000 - keep-alive idle eviction
  anthropic:
    target: https://api.anthropic.com
    # tlsVerify: true
  gemini:
    target: https://generativelanguage.googleapis.com
    # tlsVerify: true
  ollama:
    target: http://localhost:11434
    # tlsVerify: true
  bedrock:
    region: us-east-1   # AWS region; omit to disable Bedrock support
    # roleArn: arn:aws:iam::123456789012:role/BedrockProxyRole  # optional: assume this role for Bedrock calls
    # tlsVerify: true
    # timeouts:                 # same shape as the openai block above
    #   responseHeaderMs: 60000
  # azure:                                      # optional: first-class Azure OpenAI. Enable by setting target.
  #   target: https://my-resource.openai.azure.com
  #   apiVersion: "2024-02-01"                  # injected when a request omits ?api-version=
  #   entraID: false                            # true = proxy uses Azure AD/Entra token; false = pass client's api-key through
  #   # tlsVerify: true
  # openaiCompatible:
  #   mistral:
  #     target: https://api.mistral.ai
  #   cohere:
  #     target: https://api.cohere.com
  #   vllm:
  #     target: http://vllm.internal:8000
  #     timeouts:                 # per-provider override (e.g., local vLLM may need a different budget)
  #       responseHeaderMs: 60000

# Routes select a Philter policy based on request properties.
# Evaluated in order; first match wins. If no route matches, defaults apply.
# Match criteria (all specified must match): header+value, path, model.
routes:
  # Use HIPAA policy when the client sends this header; block the response if PII is detected
  - match:
      header: x-philter-policy
      value: hipaa
    policy: hipaa-safe-harbor
    context: healthcare-chatbot
    outbound:
      enabled: true
      action: block

  # Use a specific policy for GPT-4 chat completions
  - match:
      path: /v1/chat/completions
      model: gpt-4
    policy: general-purpose
    context: internal-analytics

defaults:
  policy: default
  context: none
  # outbound:
  #   enabled: false
  #   action: redact  # redact (default), block, or flag

# Authentication is disabled by default. Uncomment to enable API key auth.
# Each `key:` accepts:
#   - plaintext (hashed with SHA256 at load)
#   - sha256$<64-hex>  - pre-hashed
#   - bcrypt$<bcrypt-hash>  - pre-hashed
#   - ${ENV_VAR}       - read from an environment variable
#   - file:/path/secret - read from a file (trailing whitespace trimmed)
# The ${ENV_VAR} / file: forms keep secrets out of this file; see
# docs/configuration.md#loading-secrets-from-environment-variables-and-files
# (and #rotating-api-keys). See #api-key-hashing for the latency table and
# instructions for generating pre-hashed values.
# auth:
#   header: x-philter-proxy-key   # optional; this is the default header name
#   apiKeys:
#     - key: your-secret-key-here
#       # policy: hipaa-safe-harbor  # optional: lock this key to a specific Philter policy
#     - key: ${TEAM_B_API_KEY}     # loaded from an environment variable
#     - key: file:/run/secrets/team-c   # loaded from a mounted secret file
#     - key: sha256$2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae

