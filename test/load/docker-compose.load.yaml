# Load-test stack: a stub LLM provider and the proxy built from this repository, with the bundled model.
#
#   docker compose -f test/load/docker-compose.load.yaml up -d --build --wait
#   test/load/run.sh openai          (waits until the proxy is ready)
#   docker compose -f test/load/docker-compose.load.yaml down -v

services:

  stub-provider:
    build:
      context: ./stub-provider
    ports:
      - "${STUB_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 5

  philter-ai-proxy:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      # Override the host ports when 8080 or 9090 is taken: PROXY_PORT=18080 METRICS_PORT=19090,
      # then run.sh with PROXY_URL=https://localhost:18080.
      - "${PROXY_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    depends_on:
      stub-provider:
        condition: service_healthy
    volumes:
      - ./application-load.yaml:/etc/philter-ai-proxy/application.yaml:ro
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/etc/philter-ai-proxy/application.yaml
      # Test values only. A real deployment generates its own: openssl rand -hex 32
      - PHILTER_AI_PROXY_ENCRYPTION_KEY=6c6f61642d74657374206b6579206f6e6c792c206e6f7420666f72207573652e
      - PHILTER_AI_PROXY_BOOTSTRAP_API_KEY=load-test-bootstrap-key-not-for-real-use
